[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "editorial-crew"
version = "0.1.0"
description = "Agentic editorial workflow for improving markdown files"
requires-python = ">=3.11"
dependencies = [
    "claude-agent-sdk>=0.1.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
editorial-crew = "editorial_crew.__main__:main"
